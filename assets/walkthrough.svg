<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">LAILOW — from raw records to a review signal</title>
  <desc id="desc">Four illustrated cards show synthetic data ingestion, campaign comparison, a question and an explainable review signal.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1428"/><stop offset="1" stop-color="#163440"/></linearGradient><linearGradient id="mint" x2="1"><stop stop-color="#75E3BD"/><stop offset="1" stop-color="#8CCEFF"/></linearGradient></defs>
  <rect width="1200" height="650" rx="18" fill="url(#bg)"/>
  <text x="40" y="46" fill="#8FEACB" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">THE PRODUCT JOURNEY</text>
  <text x="40" y="83" fill="#F4FAF9" font-family="Arial,sans-serif" font-size="30" font-weight="700">A signal you can trace back to the data.</text>
  <text x="960" y="46" fill="#8DAEB4" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5">FICTIONAL DATA</text>
  <g font-family="Arial,sans-serif">
    <rect x="40" y="120" width="540" height="216" rx="18" fill="#142532" stroke="#4B7980" stroke-opacity=".65"/>
    <circle cx="76" cy="156" r="17" fill="#7EF2C5" fill-opacity=".15" stroke="#7EF2C5"/>
    <text x="76" y="162" text-anchor="middle" fill="#A7F2D7" font-size="14" font-weight="700">01</text>
    <text x="108" y="161" fill="#F3F9F8" font-size="18" font-weight="700">INGEST</text>
    <text x="76" y="200" fill="#9EBFC2" font-size="14">Campaign records become one inspectable view</text>
    <rect x="76" y="225" width="465" height="78" rx="10" fill="#1D3943"/>
    <text x="98" y="249" fill="#90F0D0" font-size="12" font-weight="700">DAY</text><text x="220" y="249" fill="#90F0D0" font-size="12" font-weight="700">CAMPAIGN</text><text x="420" y="249" fill="#90F0D0" font-size="12" font-weight="700">SPEND</text>
    <path d="M94 260 H525" stroke="#5D848A" stroke-opacity=".5"/>
    <text x="98" y="286" fill="#D6E9E8" font-size="13">2026-01-01</text><text x="220" y="286" fill="#D6E9E8" font-size="13">NOVA / Exploration</text><text x="430" y="286" fill="#D6E9E8" font-size="13">$25.00</text>
    <rect x="620" y="120" width="540" height="216" rx="18" fill="#142532" stroke="#4B7980" stroke-opacity=".65"/>
    <circle cx="656" cy="156" r="17" fill="#7EF2C5" fill-opacity=".15" stroke="#7EF2C5"/>
    <text x="656" y="162" text-anchor="middle" fill="#A7F2D7" font-size="14" font-weight="700">02</text>
    <text x="688" y="161" fill="#F3F9F8" font-size="18" font-weight="700">EXPLORE</text>
    <text x="656" y="200" fill="#9EBFC2" font-size="14">Compare campaign spend with sales</text>
    <text x="656" y="238" fill="#C8DDDF" font-size="12">NOVA</text><rect x="753" y="223" width="309" height="17" rx="8" fill="#F8C779"/><text x="1074" y="237" fill="#F5D99F" font-size="12">$383</text>
    <text x="656" y="268" fill="#C8DDDF" font-size="12">ORBIT / Exact</text><rect x="753" y="253" width="275" height="17" rx="8" fill="url(#mint)"/><text x="1074" y="267" fill="#C8DDDF" font-size="12">$341</text>
    <text x="656" y="298" fill="#C8DDDF" font-size="12">ORBIT / Disc.</text><rect x="753" y="283" width="207" height="17" rx="8" fill="url(#mint)" opacity=".68"/><text x="1074" y="297" fill="#C8DDDF" font-size="12">$257</text>
    <rect x="40" y="365" width="540" height="236" rx="18" fill="#142532" stroke="#4B7980" stroke-opacity=".65"/>
    <circle cx="76" cy="401" r="17" fill="#7EF2C5" fill-opacity=".15" stroke="#7EF2C5"/>
    <text x="76" y="407" text-anchor="middle" fill="#A7F2D7" font-size="14" font-weight="700">03</text>
    <text x="108" y="406" fill="#F3F9F8" font-size="18" font-weight="700">ASK</text>
    <text x="76" y="444" fill="#9EBFC2" font-size="14">Turn a pattern into a focused question</text>
    <rect x="76" y="471" width="454" height="78" rx="12" fill="#1D3943"/>
    <text x="99" y="500" fill="#90F0D0" font-size="12" font-weight="700">QUESTION</text>
    <text x="99" y="528" fill="#ECF7F5" font-size="16">Where did spend rise without sales?</text>
    <rect x="620" y="365" width="540" height="236" rx="18" fill="#142532" stroke="#4B7980" stroke-opacity=".65"/>
    <circle cx="656" cy="401" r="17" fill="#F8C779" fill-opacity=".13" stroke="#F8C779"/>
    <text x="656" y="407" text-anchor="middle" fill="#F8D99B" font-size="14" font-weight="700">04</text>
    <text x="688" y="406" fill="#F3F9F8" font-size="18" font-weight="700">REVIEW</text>
    <text x="656" y="444" fill="#9EBFC2" font-size="14">A human can inspect the metric behind the flag</text>
    <rect x="656" y="471" width="464" height="89" rx="12" fill="#4E3D2B" fill-opacity=".42" stroke="#F8C779" stroke-opacity=".48"/>
    <circle cx="681" cy="500" r="6" fill="#F8C779"/>
    <text x="699" y="505" fill="#F8D99B" font-size="15" font-weight="700">NOVA / Exploration</text>
    <text x="681" y="537" fill="#E8D8BB" font-size="13">$383.25 spend · $0.00 sales · review signal</text>
  </g>
  <text x="40" y="630" fill="#86A7AB" font-family="Arial,sans-serif" font-size="12">Illustrative visualization of the synthetic demo. No customer records, private UI capture or automated bid changes.</text>
</svg>
