<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">LAILOW — campaign intelligence</title><desc id="desc">Synthetic campaign spend and sales. NOVA Exploration spent 383.25 with zero sales, prompting human review.</desc><rect x="0" y="0" width="1200" height="570" rx="0" fill="#F1F0EA" stroke="none"/><rect x="0" y="0" width="1200" height="12" rx="0" fill="#2547E8" stroke="none"/><text x="46" y="58" fill="#11151B" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2">01 / FLAGSHIP</text><text x="880" y="58" fill="#11151B" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1">CAMPAIGN INTELLIGENCE</text><text x="38" y="211" fill="#11151B" font-family="Arial,Helvetica,sans-serif" font-size="154" font-weight="800" letter-spacing="-9">LAILOW</text><text x="48" y="261" fill="#11151B" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" letter-spacing="0">From campaign noise to a clearer next question.</text><path d="M48 298 L1152 298" stroke="#C9CBC6" stroke-width="1" fill="none"/><text x="48" y="342" fill="#11151B" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="1">SPEND → SALES</text><text x="48" y="375" fill="#656C70" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Fictional campaign totals</text><text x="48" y="477" fill="#11151B" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" letter-spacing="-1">ONE SIGNAL.</text><text x="48" y="513" fill="#2547E8" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="-0.5">A REASON TO LOOK CLOSER.</text><text x="460" y="340" fill="#11151B" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="0">ORBIT / Exact</text><rect x="680" y="326" width="440" height="9" rx="0" fill="#DADDD8" stroke="none"/><rect x="680" y="326" width="440.0" height="9" rx="0" fill="#2547E8" stroke="none"/><rect x="680" y="344" width="87.5" height="9" rx="0" fill="#11151B" stroke="none"/><text x="680" y="376" fill="#565D62" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">$341.25 spend  /  $1,716.00 sales</text><text x="460" y="414" fill="#11151B" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="0">ORBIT / Discovery</text><rect x="680" y="400" width="440" height="9" rx="0" fill="#DADDD8" stroke="none"/><rect x="680" y="400" width="207.6923076923077" height="9" rx="0" fill="#2547E8" stroke="none"/><rect x="680" y="418" width="65.96153846153847" height="9" rx="0" fill="#11151B" stroke="none"/><text x="680" y="450" fill="#565D62" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">$257.25 spend  /  $810.00 sales</text><text x="460" y="488" fill="#11151B" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="0">NOVA / Exploration</text><rect x="680" y="474" width="440" height="9" rx="0" fill="#DADDD8" stroke="none"/><rect x="680" y="474" width="0.0" height="9" rx="0" fill="#2547E8" stroke="none"/><rect x="680" y="492" width="98.26923076923077" height="9" rx="0" fill="#11151B" stroke="none"/><text x="680" y="524" fill="#565D62" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0">$383.25 spend  /  $0.00 sales</text><circle cx="1138" cy="478" r="7" fill="#FF673D"/><text x="48" y="552" fill="#656C70" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">PUBLIC SYNTHETIC DEMO  /  PRIVATE SOURCE &amp; BUSINESS DATA</text></svg>
