<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">LAILOW conceptual architecture</title>
  <desc id="desc">Data sources pass through preparation and storage. Structured analytics and retrieval connect to a query router, which feeds a dashboard and assistant view.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0C1727"/><stop offset="1" stop-color="#16303A"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#85BDB7" stroke-width="2"/></marker></defs>
  <rect width="1200" height="390" rx="18" fill="url(#bg)"/>
  <text x="40" y="45" fill="#83E9C6" font-size="12" font-family="Arial,sans-serif" font-weight="700" letter-spacing="2">CONCEPTUAL SYSTEM MAP</text>
  <text x="40" y="74" fill="#A7C2C5" font-size="13" font-family="Arial,sans-serif">Private prototype paths at a high level. Public demo isolates the analytics path.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="38" y="145" width="183" height="104" rx="14" fill="#1A3441" stroke="#4B7A82"/><text x="129" y="183" fill="#F2F8F8" font-size="18" font-weight="700">Data sources</text><text x="129" y="211" fill="#9FB9BC" font-size="12">API / files</text>
    <rect x="272" y="145" width="183" height="104" rx="14" fill="#1A3441" stroke="#4B7A82"/><text x="363" y="183" fill="#F2F8F8" font-size="18" font-weight="700">Preparation</text><text x="363" y="211" fill="#9FB9BC" font-size="12">clean / group / store</text>
    <rect x="510" y="112" width="185" height="92" rx="14" fill="#1D4A4A" stroke="#6BD3B1"/><text x="602" y="151" fill="#F2F8F8" font-size="18" font-weight="700">Sales analysis</text><text x="602" y="177" fill="#B7E6D6" font-size="12">structured metrics</text>
    <rect x="510" y="225" width="185" height="92" rx="14" fill="#1A3441" stroke="#4B7A82"/><text x="602" y="264" fill="#F2F8F8" font-size="18" font-weight="700">Retrieval</text><text x="602" y="290" fill="#9FB9BC" font-size="12">embeddings / vectors</text>
    <rect x="757" y="145" width="183" height="104" rx="14" fill="#1A3441" stroke="#4B7A82"/><text x="848" y="183" fill="#F2F8F8" font-size="18" font-weight="700">Query router</text><text x="848" y="211" fill="#9FB9BC" font-size="12">select response path</text>
    <rect x="990" y="145" width="172" height="104" rx="14" fill="#1A3441" stroke="#4B7A82"/><text x="1076" y="183" fill="#F2F8F8" font-size="18" font-weight="700">Experience</text><text x="1076" y="211" fill="#9FB9BC" font-size="12">dashboard / assistant</text>
  </g>
  <g stroke="#85BDB7" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M222 197 H270"/><path d="M456 197 H480 V158 H508"/><path d="M456 197 H480 V271 H508"/><path d="M696 158 H726 V197 H755"/><path d="M696 271 H726 V197 H755"/><path d="M941 197 H988"/></g>
  <rect x="511" y="338" width="184" height="28" rx="14" fill="#7EF2C5" fill-opacity=".12" stroke="#7EF2C5" stroke-opacity=".42"/><text x="603" y="356" fill="#A4F4D6" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700">PUBLIC DEMO FOCUS ↑</text>
</svg>
